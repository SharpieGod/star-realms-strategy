[package]
name = "star-realms"
version = "0.1.0"
edition = "2024"

[features]
default = ["reset_resources"]
reset_resources = []

[dependencies]
bitflags = { version = "2.13.1", features = ["serde"] }
colorize = "0.1.0"
rand = "0.10.2"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
